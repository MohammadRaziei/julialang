[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "julialang"
# The version is dynamic: it is `__version__` in julialang/__init__.py (see [tool.hatch.version]).
dynamic = ["version"]
description = "Install and switch Julia versions from pip: a tiny wheel plus a GitHub-mirrored copy of the official binaries."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com" }]
keywords = ["julia", "julialang", "julia-lang", "binary", "installer", "wheel", "version-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/mohammadraziei/julialang"
Issues = "https://github.com/mohammadraziei/julialang/issues"
Changelog = "https://github.com/mohammadraziei/julialang/blob/master/CHANGELOG.md"

[project.scripts]
julia = "julialang.julia_cli:main"
julialang = "julialang.__main__:main"

# Single source of truth: `__version__ = "X.Y.Z"` in julialang/__init__.py. Bump it by hand (or with `hatch version X.Y.Z`),
# commit, then `git tag vX.Y.Z` (must match) and push the tag.
[tool.hatch.version]
path = "julialang/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["julialang"]

[tool.hatch.build.targets.sdist]
include = ["/julialang", "/tests", "/tools", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # formatting is not enforced
