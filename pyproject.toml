[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "julialang"
# Maintained by CI (tools/release.py); the wheel's own version, not the Julia version it bundles.
version = "0.0.0"
description = "Julia in a wheel: pip install julialang, then run `julia`. Includes a small version manager."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com" }]
keywords = ["julia", "julialang", "julia-lang", "binary", "installer", "wheel", "version-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/mohammadraziei/julialang"
Issues = "https://github.com/mohammadraziei/julialang/issues"
Changelog = "https://github.com/mohammadraziei/julialang/blob/master/CHANGELOG.md"

[project.scripts]
julia = "julialang.launcher:main"
julialang = "julialang.cli:main"

[tool.setuptools.packages.find]
include = ["julialang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # formatting is not enforced
