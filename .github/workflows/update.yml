name: Sync Julia binaries

# Crawls julialang.org, mirrors new Julia archives to the `__download__` prerelease and pushes julia-list.json.

# Julia ships a patch release every month or two and a minor release about once a year, so a weekly check is
# cheap (it exits immediately when nothing is new) and never leaves a release unmirrored for long.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity; re-enable them in the
# Actions tab (or just run this workflow by hand) if that ever happens.
on:
  push:
    branches: [master]
    paths: [".github/workflows/update.yml", "tools/sync.py"] # first push (empty list) and sync fixes run it at once
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      min_version:
        description: "Oldest Julia version to mirror"
        default: "1.10.0"
      limit:
        description: "Max versions per run, newest first (0 = all)"
        default: "0"
      dry_run:
        description: "Only print what would be mirrored"
        type: boolean
        default: false

permissions:
  contents: write # create the julia_binary release, push julia-list.json
  actions: write # dispatch the wheels workflow

concurrency:
  group: sync-julia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror new Julia versions
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_VERSION: ${{ inputs.min_version || '1.10.0' }}
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          extra=""
          if [ "$DRY_RUN" = "true" ]; then extra="--dry-run"; fi
          python tools/sync.py --upload --min-version "$MIN_VERSION" --limit "$LIMIT" $extra

      # Runs even if the sync failed half-way, so the versions that did get uploaded are recorded.
      - name: Commit julia-list.json
        id: commit
        if: ${{ always() }}
        run: |
          if git diff --quiet -- julia-list.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(jq -r .latest julia-list.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add julia-list.json
          git commit -m "chore: mirror Julia (latest: $latest)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows (workflow_dispatch is the exception),
      # so start the wheel build explicitly.
      - name: Start the wheel build
        if: ${{ always() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wheels.yml --ref "${{ github.ref_name }}"
