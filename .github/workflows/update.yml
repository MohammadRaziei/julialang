name: Sync Julia binaries

# Crawls julialang.org, mirrors new Julia archives to the `__download__` prerelease and pushes julia-list.json.
#
# Runs on every push to master, weekly, and by hand. Julia ships a patch release every month or two and a minor
# release about once a year, so the weekly check is cheap: it exits at once when nothing is new.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it in the Actions tab
# (or run this workflow by hand) if that ever happens.
#
# The last step ALWAYS dispatches wheels.yml (unless this is a dry run), also when nothing was new or the sync
# failed half-way. wheels.yml decides by itself (tools/release.py plan) whether there is anything to release, so an
# extra dispatch costs a few seconds. (A push made with GITHUB_TOKEN cannot start other workflows, but
# workflow_dispatch can.)
on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      min_version:
        description: "Oldest Julia version to mirror"
        default: "1.10.0"
      limit:
        description: "Max versions per run, newest first (0 = all)"
        default: "0"
      dry_run:
        description: "Only print what would be mirrored"
        type: boolean
        default: false

permissions:
  contents: write # create the __download__ release, push julia-list.json
  actions: write # dispatch the wheels workflow

concurrency:
  group: sync-julia
  cancel-in-progress: false

jobs:
  sync:
    # Do not react to the commits CI makes itself (that would loop).
    if: >-
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'chore: mirror Julia') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror new Julia versions
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_VERSION: ${{ inputs.min_version || '1.10.0' }}
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          extra=""
          if [ "$DRY_RUN" = "true" ]; then extra="--dry-run"; fi
          python tools/sync.py --upload --min-version "$MIN_VERSION" --limit "$LIMIT" $extra

      # Runs even if the sync failed half-way, so the versions that did get uploaded are recorded.
      - name: Commit julia-list.json
        id: commit
        if: ${{ always() }}
        run: |
          if git diff --quiet -- julia-list.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(jq -r .latest julia-list.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add julia-list.json
          git commit -m "chore: mirror Julia (latest: $latest)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Always, so the release logic runs after every sync (it skips itself when there is nothing to release).
      - name: Start the wheels workflow
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wheels.yml --ref "${{ github.ref_name }}"
