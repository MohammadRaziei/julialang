name: Sync Julia binaries

# Crawls julialang.org, mirrors new Julia archives to the `__download__` prerelease and pushes julia-list.json.
#
# Runs on every push to master, weekly, and by hand. Julia ships a patch release every month or two and a minor
# release about once a year, so the weekly check is cheap: it exits at once when nothing is new.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it in the Actions tab
# (or run this workflow by hand) if that ever happens.
#
# Starting the next workflow (wheels.yml): a push made with the default GITHUB_TOKEN never triggers other
# workflows, so
#   * with the secret PUSH_TOKEN (a personal access token with contents + actions write) this job pushes with it,
#     the push of julia-list.json triggers wheels.yml, and the "mirror" commit is skipped by this workflow below;
#   * without it, this job falls back to dispatching wheels.yml explicitly.
on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      min_version:
        description: "Oldest Julia version to mirror"
        default: "1.10.0"
      limit:
        description: "Max versions per run, newest first (0 = all)"
        default: "0"
      dry_run:
        description: "Only print what would be mirrored"
        type: boolean
        default: false

permissions:
  contents: write # create the __download__ release, push julia-list.json
  actions: write # dispatch the wheels workflow

concurrency:
  group: sync-julia
  cancel-in-progress: false

jobs:
  sync:
    # Do not react to the commits CI makes itself (that would loop).
    if: >-
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'chore: mirror Julia') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror new Julia versions
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_VERSION: ${{ inputs.min_version || '1.10.0' }}
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          extra=""
          if [ "$DRY_RUN" = "true" ]; then extra="--dry-run"; fi
          python tools/sync.py --upload --min-version "$MIN_VERSION" --limit "$LIMIT" $extra

      # Runs even if the sync failed half-way, so the versions that did get uploaded are recorded.
      - name: Commit julia-list.json
        id: commit
        if: ${{ always() }}
        run: |
          if git diff --quiet -- julia-list.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(jq -r .latest julia-list.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add julia-list.json
          git commit -m "chore: mirror Julia (latest: $latest)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Only needed when the push above was made with GITHUB_TOKEN and therefore started nothing.
      - name: Start the wheel build (no PUSH_TOKEN)
        if: ${{ always() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN != '' && 'true' || 'false' }}
        run: |
          if [ "$HAS_PUSH_TOKEN" = "true" ]; then
            echo "Pushed with PUSH_TOKEN: the push itself starts wheels.yml."
          else
            gh workflow run wheels.yml --ref "${{ github.ref_name }}"
          fi
