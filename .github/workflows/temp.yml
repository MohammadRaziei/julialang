name: "TEMP: add upstream_sha256 to julia-list.json"

# ONE-OFF migration. Delete this file (and push again) once it has succeeded.
#
# Gives every file of the published julia-list.json the new `upstream_sha256` field: what julialang.org publishes today
# (`sha256` stays what the mirror computed). Nothing is downloaded or re-mirrored. A file only gets the value when
# upstream's sha256 equals the one already in the list; any difference is printed as MISMATCH and fails this job,
# and that file is left without the field (so `--strict` clients refuse it).
#
# Shares the concurrency group of sync.yml, so the two never write the list at the same time.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, do not upload the list"
        type: boolean
        default: false

permissions:
  contents: write # upload the list asset to the __download__ release

concurrency:
  group: sync-julia
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record upstream_sha256 in the published list
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          extra="--upload"
          if [ "$DRY_RUN" = "true" ]; then extra="--dry-run"; fi
          python tools/sync.py --backfill-upstream $extra
