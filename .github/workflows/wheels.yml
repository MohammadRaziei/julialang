name: Test, build and release

# Two modes, chosen by tools/release.py from the last commit:
#   prepare  a new bundled Julia is available -> run tests, build + smoke-test the wheels, store them in the
#            `__beta__` prerelease, then commit "chore(release): vX.Y.Z (Julia J)" (version, CHANGELOG, README).
#   release  HEAD is that commit (by github-actions[bot]) -> tag vX.Y.Z and publish the wheels from `__beta__`.
# Pushes made with GITHUB_TOKEN do not trigger workflows (workflow_dispatch is the exception), so the prepare
# run starts the release run explicitly. A human push of julia-list.json starts a prepare run through `push`.
on:
  push:
    branches: [master]
    paths: ["julia-list.json"]
  workflow_dispatch:
    inputs:
      force:
        description: "Prepare a release even if the bundled Julia did not change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      julia: ${{ steps.plan.outputs.julia }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to find the previous release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: plan
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          BUMP: ${{ vars.RELEASE_BUMP || 'patch' }}
        run: |
          args="--bump $BUMP"
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python tools/release.py plan $args | tee -a "$GITHUB_OUTPUT"

  unit:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  build:
    needs: [plan, unit]
    if: needs.plan.outputs.mode == 'prepare'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-latest }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        shell: bash
        env:
          JULIA: ${{ needs.plan.outputs.julia }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python tools/build_wheel.py --platform "${{ matrix.platform }}" --version "$JULIA" --package-version "$VERSION" --out dist

      - name: Install and smoke-test
        shell: bash
        env:
          JULIA: ${{ needs.plan.outputs.julia }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python -m pip install --no-index --no-deps --find-links dist "julialang==$VERSION"
          julia --version
          got=$(julia -e 'print(VERSION)')
          echo "julia reports: $got"
          [ "$got" = "$JULIA" ]
          julialang status || true # the mirror list may be unreachable; that must not fail the build

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  # Everything is healthy: park the wheels in `__beta__`, bump the version and push the release commit.
  prepare:
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the release run
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      JULIA: ${{ needs.plan.outputs.julia }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Store the wheels in the __beta__ prerelease
        run: |
          if ! gh release view __beta__ > /dev/null 2>&1; then
            gh release create __beta__ --prerelease --title "Beta wheels" \
              --notes "Wheels waiting to be released. Managed by CI - do not edit by hand."
          fi
          gh release view __beta__ --json assets --jq '.assets[].name' | while read -r name; do
            gh release delete-asset __beta__ "$name" --yes
          done
          gh release upload __beta__ dist/*.whl --clobber

      - name: Bump version, changelog and README
        run: python tools/release.py bump --version "$VERSION" --julia "$JULIA"

      - name: Commit, push and start the release run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md README.md
          git commit -m "chore(release): v$VERSION (Julia $JULIA)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          gh workflow run wheels.yml --ref "${{ github.ref_name }}"

  # HEAD is the release commit made above: tag it and publish the wheels that were already tested.
  release:
    needs: [plan, unit]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # PyPI trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the tested wheels from __beta__
        run: |
          gh release download __beta__ --pattern "julialang-$VERSION-*.whl" --dir dist
          count=$(ls dist/*.whl | wc -l)
          echo "found $count wheels:"
          ls -l dist
          [ "$count" -eq 5 ] # one per platform

      - name: Release notes from CHANGELOG.md
        run: python tools/release.py notes "$VERSION" > RELEASE_NOTES.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: julialang ${{ needs.plan.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*.whl
          make_latest: true

      # Needs trusted publishing configured on PyPI and a repository variable PUBLISH_PYPI=true.
      # The wheels are > 100 MB, so the project's file size limit must be raised on PyPI first.
      - name: Publish to PyPI
        if: ${{ vars.PUBLISH_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
