name: Test, build and release

# One pure-Python wheel (py3-none-any): Julia itself is downloaded at run time from the mirror. Two modes, chosen by
# tools/release.py from the repository state:
#   prepare  package files changed since the last tag -> run the tests, build the wheel, smoke-test it on every OS
#            (a real `julialang install` from the mirror), park it in the `__beta__` prerelease, then commit
#            "chore(release): vX.Y.Z" (version, CHANGELOG, README).
#   release  HEAD is that commit (made by github-actions[bot]) -> tag vX.Y.Z, publish the release and upload to PyPI.
# Pushes made with GITHUB_TOKEN do not trigger workflows (workflow_dispatch is the exception), so the prepare run
# starts the release run explicitly. update.yml starts this workflow after every sync and every push.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Prepare a release even if the package did not change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # The branch tip, not the commit this run was queued for: a run that waited behind another one must see its release commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 # tags are needed to find the previous release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: plan
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          BUMP: ${{ vars.RELEASE_BUMP || 'patch' }}
        run: |
          args="--bump $BUMP"
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python tools/release.py plan $args | tee -a "$GITHUB_OUTPUT"

  unit:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest setuptools wheel ruff
      - run: python -m ruff check .
      - run: python -m pytest -q tests

  build:
    needs: [plan, unit]
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python tools/release.py set-version "$VERSION"
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # A real end-to-end test on every OS: install the wheel, install Julia from the mirror, run it.
  # It doubles as a health check of the mirror after every sync.
  smoke:
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'prepare'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-latest }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      JULIALANG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Install the latest Julia from the mirror and run it
        shell: bash
        run: |
          julia && echo "julia without an install must fail" && exit 1 || true # the shim must explain, not crash
          julialang fetch
          latest=$(julialang latest)
          echo "latest on the mirror: $latest"
          julialang install
          got=$(julia -e 'print(VERSION)')
          echo "julia reports: $got"
          [ "$got" = "$latest" ]
          julialang status

      - name: Install, switch and remove an older line
        shell: bash
        run: |
          julialang install 1.10 --no-default
          got=$(JULIALANG_VERSION=1.10 julia -e 'print(VERSION)')
          echo "1.10 reports: $got"
          case "$got" in 1.10.*) ;; *) exit 1 ;; esac
          julialang use 1.10
          julialang use latest
          julialang uninstall 1.10 --yes
          julialang list --installed

  # Everything is healthy: park the wheel in `__beta__`, bump the version and push the release commit.
  prepare:
    needs: [plan, smoke]
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the release run
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Store the build in the __beta__ prerelease
        run: |
          if ! gh release view __beta__ > /dev/null 2>&1; then
            gh release create __beta__ --prerelease --latest=false --title "Beta wheels" \
              --notes "Builds waiting to be released. Managed by CI - do not edit by hand."
          fi
          gh release view __beta__ --json assets --jq '.assets[].name' | while read -r name; do
            gh release delete-asset __beta__ "$name" --yes
          done
          gh release upload __beta__ dist/* --clobber

      - name: Bump version, changelog and README
        run: python tools/release.py bump --version "$VERSION"

      - name: Commit, push and start the release run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md README.md
          git commit -m "chore(release): v$VERSION"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          gh workflow run wheels.yml --ref "${{ github.ref_name }}"

  # HEAD is the release commit made above: tag it and publish the build that was already tested.
  release:
    needs: [plan, unit]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TWINE_USERNAME: ${{ secrets.PYPI_USER || '__token__' }}
      TWINE_PASSWORD: ${{ secrets.PYPI_PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the tested build from __beta__
        run: |
          gh release download __beta__ --pattern "julialang-$VERSION*" --dir dist
          echo "found:"
          ls -l dist
          [ "$(ls dist/*.whl | wc -l)" -eq 1 ] # exactly one pure wheel
          [ "$(ls dist/*.tar.gz | wc -l)" -eq 1 ]

      - name: Release notes from CHANGELOG.md
        run: python tools/release.py notes "$VERSION" > RELEASE_NOTES.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: julialang ${{ needs.plan.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          make_latest: true

      # phasma-style secrets: PYPI_PASS (an API token) and optionally PYPI_USER (must be __token__ when PYPI_PASS is a token).
      # Secrets are per repository: the ones of another repo (e.g. phasma) do not apply here.
      - name: Warn when PyPI is not configured
        if: ${{ env.TWINE_PASSWORD == '' }}
        run: |
          echo "::warning title=PyPI upload skipped::The repository secret PYPI_PASS is not set, so nothing was uploaded to PyPI. Add it under Settings > Secrets and variables > Actions, then run the 'Publish to PyPI' workflow for this tag."

      - name: Publish to PyPI
        if: ${{ env.TWINE_PASSWORD != '' }}
        run: |
          python -m pip install twine
          python -m twine upload --skip-existing dist/*
